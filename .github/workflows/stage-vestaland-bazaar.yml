name: Stage verified Vestaland 1.3.0 in CafeBazaar

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stage-vestaland-bazaar.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  stage:
    if: "github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'release: stage verified Vestaland 1.3.0 in CafeBazaar'"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download signed 1.3.0 build from verified run
        uses: actions/download-artifact@v4
        with:
          name: vestaland-cafebazaar-1.3.0
          run-id: 38611752348
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: verified-release
      - name: Verify APK signature, package and version, then stage in CafeBazaar
        env:
          CAFEBAZAR_API: ${{ secrets.CAFEBAZAR_API }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, pathlib, uuid, urllib.request, urllib.error, subprocess, glob
          apk = pathlib.Path("verified-release/vestaland-1.3.0-cafebazaar.apk")
          if not apk.is_file(): raise SystemExit("No signed APK in source artifact")
          sdk = os.environ.get("ANDROID_HOME") or os.environ.get("ANDROID_SDK_ROOT") or "/usr/local/lib/android/sdk"
          def sdktool(name):
              files = glob.glob(sdk+"/build-tools/*/"+name)
              if not files: raise SystemExit("Android build tool missing: "+name)
              return sorted(files, reverse=True)[0]
          signer=sdktool("apksigner")
          aapt=sdktool("aapt")
          result=subprocess.run([signer,"verify","--verbose","--print-certs",str(apk)],capture_output=True,text=True,check=True).stdout
          fingerprints=[line.split("digest:",1)[1].strip().replace(":","").upper() for line in result.splitlines() if "certificate SHA-256 digest:" in line]
          expected="7220E3B8AB418045E84091269B495339AE6971A998C005CF6E84142EA73C8077"
          print("Observed APK signer fingerprints:", fingerprints)
          if fingerprints != [expected]: raise SystemExit("Signer differs from original 1.0.1 Vestaland AAB")
          package=subprocess.run([aapt,"dump","badging",str(apk)],capture_output=True,text=True,check=True).stdout
          manifest=next((line for line in package.splitlines() if line.startswith("package:")), "")
          print(manifest)
          for expected_part in ("name='ir.vestaland.app'","versionCode='5'","versionName='1.3.0'"):
              if expected_part not in manifest: raise SystemExit("Package identity/version mismatch")
          print("Verified original signing SHA256:",expected)
          secret=os.environ.get("CAFEBAZAR_API","")
          if not secret: raise SystemExit("CAFEBAZAR_API secret unavailable")
          base="https://api.pishkhan.cafebazaar.ir/v1/apps/releases/"
          headers={"CAFEBAZAAR-PISHKHAN-API-SECRET":secret,"Accept":"application/json"}
          def request(method,suffix="",data=None,extra=None,timeout=40):
              req=urllib.request.Request(base+suffix,data=data,method=method,headers={**headers,**(extra or {})})
              try:
                  with urllib.request.urlopen(req,timeout=timeout) as r:
                      status=r.status; content=r.read(250000)
              except urllib.error.HTTPError as e:
                  status=e.code; content=e.read(16000)
              try: response=json.loads(content)
              except (ValueError,TypeError): response={}
              if not 200 <= status < 300:
                  print("CafeBazaar request failed at",suffix or "new release","HTTP",status)
                  if isinstance(response,dict):
                      for key in ("message","error","code"):
                          val=response.get(key)
                          if isinstance(val,str): print(key, val[:180])
                  raise SystemExit(1)
              return response
          def versions(obj):
              release=obj.get("release") if isinstance(obj,dict) else None
              packs=release.get("packages") if isinstance(release,dict) else []
              if not isinstance(packs,list): return []
              return [int(item["version_code"]) for item in packs if isinstance(item,dict) and str(item.get("version_code","")).isdigit()]
          pub=versions(request("GET","last-published/"))
          com=versions(request("GET","last-committed/"))
          print("CafeBazaar baseline published:",pub,"committed:",com)
          if not pub or max(pub)!=2 or not com or max(com)!=2:
              raise SystemExit("Unexpected existing release state; refusing upload")
          draft=request("GET","last-uncommitted/")
          existing=draft.get("release") if isinstance(draft,dict) else None
          if existing and versions(draft): raise SystemExit("Draft already contains a package; will not replace it")
          if existing:
              print("Reusing previously created empty draft from the verified release attempt")
          else:
              created=request("POST","",b"")
              print("Release draft created. Response keys:",list(created) if isinstance(created,dict) else [])
          boundary="----Vestaland"+uuid.uuid4().hex
          def field(name,body,filename=None,mime=None):
              prefix=('--'+boundary+'\r\nContent-Disposition: form-data; name="'+name+'"'+('; filename="'+filename+'"' if filename else '')+'\r\n'+('Content-Type: '+mime+'\r\n' if mime else '')+'\r\n').encode()
              return prefix+body+b'\r\n'
          upload=field("architecture",b"all")+field("apk",apk.read_bytes(),apk.name,"application/vnd.android.package-archive")+('--'+boundary+'--\r\n').encode()
          result=request("POST","upload/",upload,{"Content-Type":"multipart/form-data; boundary="+boundary},timeout=150)
          print("Signed APK upload accepted. Response fields:",list(result) if isinstance(result,dict) else [])
          check=request("GET","last-uncommitted/")
          print("Draft release package version codes:",versions(check))
          print("This is a DRAFT only. No commit, submission or publication performed.")
          PY
