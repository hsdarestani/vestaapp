name: Inspect market images
on:
  push:
    paths:
      - '.github/workflows/inspect-market-images.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect image URLs and responses
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://vestaland.smarbiz.sbs'
          JSON="$(curl -fsS --max-time 30 -A 'Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/131 Safari/537.36' "$BASE/api/market/products?store=all&per_page=8")"
          echo "$JSON" | jq -r '.items[:8][] | [.store, (.id|tostring), .name, .image, .permalink] | @tsv' > /tmp/products.tsv
          while IFS=$'\t' read -r store id name image permalink; do
            echo "PRODUCT $store $id $name"
            echo "IMAGE $image"
            [ -z "$image" ] && continue
            curl -sSIL --max-time 20 -A 'Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/131 Safari/537.36' -e "$permalink" "$image" | grep -Ei 'HTTP/|content-type:|content-length:|location:' | tail -n 8 || true
          done < /tmp/products.tsv
