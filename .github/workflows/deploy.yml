name: Deploy isolated Vestaapp

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vestaapp-only-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Validate release files and script
        run: |
          set -euo pipefail
          for x in index.html styles.css app.js sw.js icon.svg manifest.webmanifest deploy/rollout.sh deploy/compose.yml deploy/app-nginx.conf deploy/market.Dockerfile backend/market_server.py; do
            test -s "$x"
          done
          node --check app.js
          bash -n deploy/rollout.sh
          python3 -m py_compile backend/market_server.py
          docker compose -f deploy/compose.yml config -q
          grep -q 'app.vesta-cosmetics.ir' deploy/rollout.sh
          ! grep -q 'rm -f /etc/nginx/sites-enabled/default' deploy/rollout.sh
      - name: Create release archive
        run: |
          tar -czf "$RUNNER_TEMP/vestaapp-release.tgz" \
            index.html styles.css app.js sw.js icon.svg manifest.webmanifest \
            backend/market_server.py deploy/market.Dockerfile deploy/compose.yml deploy/app-nginx.conf
      - name: Install SSH transport
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Deploy to separate containers
        shell: bash
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "${HOST:-}" || { echo "Missing HOST"; exit 1; }
          test -n "${PASS:-}" || { echo "Missing PASS"; exit 1; }
          test -n "${SSH_KNOWN_HOSTS:-}" || { echo "Missing trusted SSH_KNOWN_HOSTS"; exit 1; }
          target="$HOST"
          [[ "$target" == *"@"* ]] || target="root@$target"
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh_opts=(-o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=15)
          sshpass -p "$PASS" scp "${ssh_opts[@]}" "$RUNNER_TEMP/vestaapp-release.tgz" "$target:/tmp/vestaapp-release.tgz"
          sshpass -p "$PASS" ssh "${ssh_opts[@]}" "$target" 'bash -s' < deploy/rollout.sh
      - name: Verify new app and untouched stores
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 25 https://app.vesta-cosmetics.ir/ | grep -q 'وستالند'
          curl --fail --silent --show-error --max-time 25 https://app.vesta-cosmetics.ir/api/market/health | grep -q '"ok":true'
          for site in https://vesta-cosmetics.ir/ https://cutellashop.ir/; do
            curl -sS -o /dev/null -w '%{http_code}\n' --max-time 25 "$site"
          done
