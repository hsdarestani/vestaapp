name: Warm Vestaland market cache

on:
  workflow_run:
    workflows: ["Deploy Vestaland production"]
    types: [completed]

jobs:
  warm:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Warm catalog, categories and first images
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://vestaland.smarbiz.sbs'
          curl -fsS --retry 3 --retry-delay 2 --max-time 45 "$BASE/api/market/products?store=all&per_page=30" -o /tmp/market.json
          curl -fsS --max-time 30 "$BASE/api/market/categories?store=vesta" >/dev/null || true
          curl -fsS --max-time 30 "$BASE/api/market/categories?store=cutella" >/dev/null || true
          python3 - <<'PY' > /tmp/market-images.txt
          import json
          with open('/tmp/market.json', encoding='utf-8') as f:
              d=json.load(f)
          seen=[]
          for p in d.get('items',[]):
              u=p.get('image') or ''
              if u and u not in seen:
                  seen.append(u)
              if len(seen)>=10:
                  break
          for u in seen:
              print(u)
          PY
          sed -i "s#^/#$BASE/#" /tmp/market-images.txt
          xargs -r -P5 -I{} curl -fsS --max-time 30 '{}' -o /dev/null < /tmp/market-images.txt || true
          echo "Warm-up complete: $(wc -l < /tmp/market-images.txt) product images primed."
