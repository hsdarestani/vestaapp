name: Vestaland test-phone SMS delivery once
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-otp-delivery.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify OTP only for allowlisted test phone and send one code
        env:
          SMS_TEST_PHONE: ${{ secrets.SMS_TEST_PHONE }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os,re,urllib.request,urllib.error
          phone=os.getenv("SMS_TEST_PHONE","")
          if not re.fullmatch(r"09[0-9]{9}",phone):
              raise SystemExit("Test phone secret is missing or invalid")
          base="https://app.vesta-cosmetics.ir/api/account/"
          headers={"Accept":"application/json","User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/130.0.0.0 Safari/537.36"}
          with urllib.request.urlopen(urllib.request.Request(base+"config",headers=headers),timeout=15) as r:
              config=json.loads(r.read(10000))
          assert config["features"]["otp_enabled"] is True
          assert config["features"]["login_required"] is False
          print("OTP is restricted to the tester; global login remains optional.")
          req=urllib.request.Request(base+"otp/request",
              data=json.dumps({"phone":phone}).encode(),method="POST",
              headers={**headers,"Content-Type":"application/json","Origin":"https://app.vesta-cosmetics.ir"})
          try:
              with urllib.request.urlopen(req,timeout=25) as r:
                  code=r.status;result=json.loads(r.read(12000))
          except urllib.error.HTTPError as e:
              code=e.code
              try:result=json.loads(e.read(12000))
              except:result={}
          print("SMS request HTTP status:",code)
          print("Provider accepted:",result.get("ok") is True)
          if code!=200 or result.get("ok") is not True:
              print("Error:",str(result.get("error","unknown"))[:120])
              raise SystemExit("SMS request failed. Login enforcement must remain disabled.")
          print("One SMS request accepted for test number (phone and one-time code are never logged).")
          PY
      - name: Verify both storefronts remain available
        shell: bash
        run: |
          set -euo pipefail
          for host in vesta-cosmetics.ir cutellashop.ir; do
            status="$(curl -sS --max-time 18 -o /dev/null -w '%{http_code}' "https://$host/")"
            echo "$host HTTP=$status"
            [[ "$status" = 200 || "$status" = 301 || "$status" = 302 ]]
          done
