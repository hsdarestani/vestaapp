name: Live market cart compatibility

on:
  push:
    paths:
      - .github/workflows/market-cart-check.yml

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check Vesta and Cutella Store API carts
        shell: bash
        run: |
          set -u
          BASE='https://vestaland.smarbiz.sbs/api/market'
          sleep 4
          FAIL=0
          for STORE in vesta cutella; do
            echo "===== $STORE ====="
            PRODUCTS="$(curl -sS --max-time 35 "$BASE/products?store=$STORE&per_page=30")"
            ID="$(JSON="$PRODUCTS" python3 - <<'PY'
          import json, os
          try: d=json.loads(os.environ['JSON'])
          except Exception: d={}
          for p in d.get('items',[]):
              if p.get('is_in_stock') and p.get('is_purchasable') and not p.get('has_options'):
                  print(p['id']); break
          PY
            )"
            echo "Product: ${ID:-none}"
            if [ -z "$ID" ]; then FAIL=1; continue; fi
            TMP="$(mktemp)"
            CODE="$(curl -sS --max-time 35 -o "$TMP" -w '%{http_code}' -H 'Content-Type: application/json' -d "{\"store\":\"$STORE\",\"items\":[{\"id\":$ID,\"quantity\":1}]}" "$BASE/quote")"
            echo "HTTP $CODE"
            cat "$TMP"; echo
            if [ "$CODE" != 200 ] || ! grep -q '"ok":true' "$TMP"; then FAIL=1; fi
            rm -f "$TMP"
          done
          exit "$FAIL"
