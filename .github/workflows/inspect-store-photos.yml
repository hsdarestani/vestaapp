name: Inspect real product photos for Vestaland
on:
  push:
    branches: [design/real-store-photos-20261013]
    paths: ['.github/workflows/inspect-store-photos.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check real Woo product images from both stores (read-only)
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,json
          hdr={"User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36","Accept":"application/json"}
          for name,domain in (("Vesta","vesta-cosmetics.ir"),("Cutella","cutellashop.ir")):
              url=f"https://{domain}/wp-json/wc/store/v1/products?per_page=35"
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers=hdr),timeout=24) as r:
                      items=json.loads(r.read(900000))
              except Exception as e:
                  print(name,"CATALOG ERROR",type(e).__name__,str(e)[:150]);continue
              print(name,"TOTAL",len(items) if isinstance(items,list) else "invalid")
              for p in (items if isinstance(items,list) else [])[:26]:
                  imgs=p.get("images") or []
                  first=(imgs[0].get("src") or "") if imgs else ""
                  cats=", ".join(c.get("name","") for c in p.get("categories",[]) if isinstance(c,dict))
                  print(name,"item",p.get("id"),str(p.get("name",""))[:65],"categories",cats[:80],"image",first[:250])
          PY
