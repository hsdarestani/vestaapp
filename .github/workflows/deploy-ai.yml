name: Deploy Vestaland Cloudflare AI
on:
  workflow_dispatch:
  push:
    branches: [feature/login-gate-photo-ai-entry]
    paths: ['.github/workflows/deploy-ai.yml']
permissions:
  contents: read
concurrency:
  group: vestaland-cloudflare-ai
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Cloudflare credentials and Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AI_SHARED: ${{ secrets.CF_AI_SHARED_SECRET }}
          ZIBAL_MERCHANT: ${{ secrets.ZIBAL_MERCHANT }}
        run: |
          set -euo pipefail
          test -n "${ZIBAL_MERCHANT:-}" || { echo "Missing ZIBAL_MERCHANT"; exit 1; }
          node --check cloudflare/src/index.js
          python3 -m json.tool cloudflare/wrangler.jsonc >/dev/null
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test "${#AI_SHARED}" -ge 32
      - name: Install wrangler
        run: npm install --no-audit --no-fund --prefix /tmp/wrangler-tools wrangler@4
      - name: Deploy Worker and set private server-to-server token
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AI_SHARED: ${{ secrets.CF_AI_SHARED_SECRET }}
        run: |
          set -euo pipefail
          /tmp/wrangler-tools/node_modules/.bin/wrangler deploy
          printf '%s' "$AI_SHARED" | /tmp/wrangler-tools/node_modules/.bin/wrangler secret put AI_SHARED_SECRET
          echo "Worker uploaded. Copy the final *.workers.dev URL to CF_AI_WORKER_URL in repository secrets."
