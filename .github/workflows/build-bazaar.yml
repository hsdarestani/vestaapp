name: Build CafeBazaar Android

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-bazaar.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: yes | sdkmanager --licenses >/dev/null && sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compile Android app
        env:
          BAZAAR_RSA_PUBLIC_KEY: ${{ secrets.BAZAAR_RSA_PUBLIC_KEY }}
        run: gradle -p android :app:assembleDebug --stacktrace

      - name: Detect signing secrets
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.BAZAAR_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.BAZAAR_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BAZAAR_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.BAZAAR_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$STORE_PASS" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASS" ]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
            echo 'CafeBazaar signing credentials are available.'
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'CafeBazaar signing credentials are not configured; building an unsigned release AAB for offline signing.'
          fi

      - name: Restore signing key
        if: steps.signing.outputs.available == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.BAZAAR_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/vestaland-bazaar.jks"
          chmod 600 "$RUNNER_TEMP/vestaland-bazaar.jks"

      - name: Build signed APK and AAB
        if: steps.signing.outputs.available == 'true'
        env:
          BAZAAR_KEYSTORE_PATH: ${{ runner.temp }}/vestaland-bazaar.jks
          BAZAAR_KEYSTORE_PASSWORD: ${{ secrets.BAZAAR_KEYSTORE_PASSWORD }}
          BAZAAR_KEY_ALIAS: ${{ secrets.BAZAAR_KEY_ALIAS }}
          BAZAAR_KEY_PASSWORD: ${{ secrets.BAZAAR_KEY_PASSWORD }}
          BAZAAR_RSA_PUBLIC_KEY: ${{ secrets.BAZAAR_RSA_PUBLIC_KEY }}
        run: gradle -p android clean :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Build unsigned release AAB
        if: steps.signing.outputs.available != 'true'
        env:
          BAZAAR_RSA_PUBLIC_KEY: ${{ secrets.BAZAAR_RSA_PUBLIC_KEY }}
        run: gradle -p android :app:bundleRelease --stacktrace

      - name: Collect outputs
        run: |
          set -euo pipefail
          mkdir -p bazaar-output
          cp android/app/build/outputs/apk/debug/app-debug.apk bazaar-output/vestaland-1.0.1-test.apk
          if [ "${{ steps.signing.outputs.available }}" = "true" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk bazaar-output/vestaland-1.0.1-cafebazaar.apk
            cp android/app/build/outputs/bundle/release/app-release.aab bazaar-output/vestaland-1.0.1-cafebazaar.aab
          else
            cp android/app/build/outputs/bundle/release/app-release.aab bazaar-output/vestaland-1.0.1-unsigned.aab
          fi
          sha256sum bazaar-output/* > bazaar-output/SHA256SUMS.txt

      - name: Upload CafeBazaar package
        uses: actions/upload-artifact@v4
        with:
          name: vestaland-cafebazaar-1.0.1
          path: bazaar-output/
          retention-days: 30
