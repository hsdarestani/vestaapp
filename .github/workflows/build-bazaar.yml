name: Build CafeBazaar Android

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-bazaar.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: yes | sdkmanager --licenses >/dev/null && sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compile Android app
        run: gradle -p android :app:assembleDebug --stacktrace

      - name: Check signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.BAZAAR_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.BAZAAR_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BAZAAR_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.BAZAAR_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || (echo 'Missing BAZAAR_KEYSTORE_BASE64' && exit 1)
          test -n "$STORE_PASS" || (echo 'Missing BAZAAR_KEYSTORE_PASSWORD' && exit 1)
          test -n "$KEY_ALIAS" || (echo 'Missing BAZAAR_KEY_ALIAS' && exit 1)
          test -n "$KEY_PASS" || (echo 'Missing BAZAAR_KEY_PASSWORD' && exit 1)

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.BAZAAR_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/vestaland-bazaar.jks"
          chmod 600 "$RUNNER_TEMP/vestaland-bazaar.jks"

      - name: Build signed APK and AAB
        env:
          BAZAAR_KEYSTORE_PATH: ${{ runner.temp }}/vestaland-bazaar.jks
          BAZAAR_KEYSTORE_PASSWORD: ${{ secrets.BAZAAR_KEYSTORE_PASSWORD }}
          BAZAAR_KEY_ALIAS: ${{ secrets.BAZAAR_KEY_ALIAS }}
          BAZAAR_KEY_PASSWORD: ${{ secrets.BAZAAR_KEY_PASSWORD }}
        run: gradle -p android clean :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Collect outputs
        run: |
          mkdir -p bazaar-output
          cp android/app/build/outputs/apk/release/app-release.apk bazaar-output/vestaland-1.0.0-cafebazaar.apk
          cp android/app/build/outputs/bundle/release/app-release.aab bazaar-output/vestaland-1.0.0-cafebazaar.aab
          sha256sum bazaar-output/* > bazaar-output/SHA256SUMS.txt

      - name: Upload CafeBazaar package
        uses: actions/upload-artifact@v4
        with:
          name: vestaland-cafebazaar-1.0.0
          path: bazaar-output/
          retention-days: 30
