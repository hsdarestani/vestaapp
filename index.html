<body class="auth-pending">
<div id="entrySplash" class="entry-splash" role="status" aria-label="وستالند در حال آماده شدن" aria-live="polite">
  <div class="entry-stars" aria-hidden="true"><span>✦</span><span>✧</span><span>✿</span><span>✦</span><span>✧</span><span>✧</span><span>✦</span><span>✧</span></div>
  <div class="entry-scene">
    <p class="entry-eyebrow">⋆ YOUR STYLE, YOUR SPACE ⋆</p>
    <div class="entry-stage" aria-hidden="true">
      <div class="entry-aura"></div><div class="entry-orbit"></div><div class="entry-orbit second"></div>
      <div class="entry-puff one"></div><div class="entry-puff two"></div>
      <div class="entry-bow-wrap"><img src="/icon.svg" width="136" height="136" alt="" fetchpriority="high"></div>
      <span class="entry-stardust s1">✦</span><span class="entry-stardust s2">✧</span><span class="entry-stardust s3">✧</span><span class="entry-stardust s4">✦</span>
      <span class="entry-mini heart">💗</span><span class="entry-mini flower">🌸</span><span class="entry-mini butterfly">🦋</span>
    </div>
    <h1 class="entry-name">وستالند</h1>
    <p class="entry-tagline">استایل، کمد و میز آرایش تو در یک جا</p>
    <div class="entry-pill" aria-hidden="true"><span class="spark">✦</span> آماده برای شروع <span class="spark">✦</span></div>
    <div class="entry-progress-block">
      <div class="entry-progress-track" role="progressbar" aria-label="در حال آماده‌سازی" aria-valuemin="0" aria-valuemax="100"><div class="entry-progress-fill"></div></div>
      <p class="entry-progress-label" id="entrySplashStatus">در حال آماده‌سازی وستالند...</p>
    </div>
    <button type="button" id="entryContinue" class="entry-continue" hidden>ورود به وستالند ♡</button>
  </div>
</div>
<div class="sparkle-bg" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<div class="shell">
  <header class="topbar">
    <div class="brand"><span class="brand-mark" aria-hidden="true"><img src="/icon.svg" width="32" height="32" alt=""></span><div><strong>وستالند</strong><small>your style, your space</small></div></div>
    <button class="circle-btn" id="aboutBtn" aria-label="پروفایل من">♡</button>
  </header>
  <main id="appContent" tabindex="-1" aria-live="polite"></main>
  <nav class="bottom-nav" aria-label="بخش‌های اپ">
    <button type="button" data-route="home" class="active"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 11 9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></span><b>خونه</b></button>
    <button type="button" data-route="closet"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7V6a2.3 2.3 0 1 1 2.4 2.3L21 13a1.5 1.5 0 0 1-.9 2.7H3.9A1.5 1.5 0 0 1 3 13l9-5"/></svg></span><b>کمد من</b></button>
    <button type="button" data-route="beauty"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 8V4c0-1 .7-2 1.5-2S12 3 12 4v4M8 8h6v4H8zM8 12h6v8a2 2 0 0 1-2 2h-2a2 2 0 0 1-2-2z"/></svg></span><b>میز آرایش</b></button>
    <button type="button" data-route="shop"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h16l-1 12H5L4 9zM9 10V7a3 3 0 0 1 6 0v3"/></svg></span><b>فروشگاه</b></button>
    <button type="button" data-route="me"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4.5 21v-2a7.5 7.5 0 0 1 15 0v2z"/></svg></span><b>من</b></button>
  </nav>
</div>
<div class="dialog hidden" id="editorDialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
  <button class="dialog-shade" type="button" data-close aria-label="بستن"></button>
  <div class="dialog-card">
    <div class="dialog-grip"></div>
    <div class="dialog-head"><h2 id="dialogTitle">اضافه کردن</h2><button class="circle-btn close-btn" type="button" data-close aria-label="بستن">×</button></div>
    <form id="itemForm" class="item-form">
      <div class="photo-upload"><div class="upload-preview" id="photoPreview"><span class="photo-upload-empty">عکس وسیله</span><small>از دوربین یا گالری انتخاب کن</small></div><div class="photo-entry-actions"><label class="upload-button">عکس گرفتن<input id="itemCamera" type="file" accept="image/*" capture="environment"></label><label class="upload-button">از گالری<input id="itemPhoto" type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif"></label></div><button type="button" class="btn btn-outline ai-scan-button" id="aiScanButton" disabled>تکمیل با عکس</button><small>یه عکس بگیر تا مشخصات وسیله سریع‌تر تکمیل بشه.</small></div>
      <label>اسم وسیله <input id="itemName" maxlength="90" required placeholder="مثلاً شومیز صورتی" /></label>
      <label>دسته‌بندی <select id="itemCategory" required></select></label>
      <div class="form-grid"><label>رنگ <select id="itemColor"><option value="pink">صورتی</option><option value="white">سفید</option><option value="black">مشکی</option><option value="cream">کرم</option><option value="blue">آبی</option><option value="green">سبز</option><option value="red">قرمز</option><option value="brown">قهوه‌ای</option><option value="purple">یاسی</option><option value="other">متفرقه</option></select></label><label>برند (اختیاری)<input id="itemBrand" maxlength="55" placeholder="برند" /></label></div>
      <div id="beautyFields" class="hidden"><div class="form-grid"><label>تاریخ باز کردن<input id="itemOpened" type="date" /></label><label>ماندگاری بعد از باز شدن<select id="itemPAO"><option value="0">نامشخص</option><option value="3">۳ ماه</option><option value="6">۶ ماه</option><option value="12">۱۲ ماه</option><option value="18">۱۸ ماه</option><option value="24">۲۴ ماه</option></select></label></div><label>روتین<select id="itemRoutine"><option value="none">بدون روتین</option><option value="am">صبح</option><option value="pm">شب</option><option value="both">صبح و شب</option></select></label></div>
      <button class="btn btn-primary btn-block" type="submit">ذخیره توی دنیای من ♡</button>
    </form>
  </div>
</div>
<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
</body>
</html>
