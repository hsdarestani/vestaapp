<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#fff0f7">
<meta name="description" content="وستالند، کمد لباس و میز آرایش هوشمند شخصی تو با خرید از وستا و کیوتلا.">
<meta name="color-scheme" content="light">
<title>وستالند | دنیای خوشگل خودت</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/styles.css?v=20261012-closet1">
<script src="/app.js?v=20261012-closet1" defer></script>
</head>
<body>
<div class="sparkle-bg" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<div class="shell">
  <header class="topbar">
    <div class="brand"><span class="brand-mark" aria-hidden="true">🎀</span><div><strong>وستالند</strong><small>little things, big sparkle</small></div></div>
    <button class="circle-btn" id="aboutBtn" aria-label="درباره اپ">♡</button>
  </header>
  <main id="appContent" tabindex="-1" aria-live="polite"></main>
  <nav class="bottom-nav" aria-label="بخش‌های اپ">
    <button type="button" data-route="home" class="active"><span>🏡</span><b>خونه</b></button>
    <button type="button" data-route="closet"><span>👗</span><b>کمد من</b></button>
    <button type="button" data-route="beauty"><span>💄</span><b>میز آرایش</b></button>
    <button type="button" data-route="shop"><span>🛍️</span><b>فروشگاه</b></button>
    <button type="button" data-route="me"><span>🧸</span><b>من</b></button>
  </nav>
</div>
<div class="dialog hidden" id="editorDialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
  <button class="dialog-shade" type="button" data-close aria-label="بستن"></button>
  <div class="dialog-card">
    <div class="dialog-grip"></div>
    <div class="dialog-head"><h2 id="dialogTitle">اضافه کردن</h2><button class="circle-btn close-btn" type="button" data-close aria-label="بستن">×</button></div>
    <form id="itemForm" class="item-form">
      <div class="photo-upload"><div class="upload-preview" id="photoPreview"><span>📸</span><small>عکس وسیله‌ات رو بذار</small></div><label class="upload-button">انتخاب عکس<input id="itemPhoto" type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif" /></label><small>عکس‌ها فقط روی همین دستگاه ذخیره می‌شن.</small></div>
      <label>اسم وسیله <input id="itemName" maxlength="90" required placeholder="مثلاً شومیز صورتی" /></label>
      <label>دسته‌بندی <select id="itemCategory" required></select></label>
      <div class="form-grid"><label>رنگ <select id="itemColor"><option value="pink">صورتی</option><option value="white">سفید</option><option value="black">مشکی</option><option value="cream">کرم</option><option value="blue">آبی</option><option value="green">سبز</option><option value="red">قرمز</option><option value="brown">قهوه‌ای</option><option value="purple">یاسی</option><option value="other">متفرقه</option></select></label><label>برند (اختیاری)<input id="itemBrand" maxlength="55" placeholder="برند" /></label></div>
      <div id="beautyFields" class="hidden"><div class="form-grid"><label>تاریخ باز کردن<input id="itemOpened" type="date" /></label><label>ماندگاری بعد از باز شدن<select id="itemPAO"><option value="0">نامشخص</option><option value="3">۳ ماه</option><option value="6">۶ ماه</option><option value="12">۱۲ ماه</option><option value="18">۱۸ ماه</option><option value="24">۲۴ ماه</option></select></label></div><label>روتین<select id="itemRoutine"><option value="none">بدون روتین</option><option value="am">صبح ☀️</option><option value="pm">شب 🌙</option><option value="both">صبح و شب</option></select></label></div>
      <button class="btn btn-primary btn-block" type="submit">ذخیره توی دنیای من ♡</button>
    </form>
  </div>
</div>
<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
</body>
</html>
