server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 2m;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    # Let's Encrypt HTTP-01 tokens, served from isolated shared read-only volume.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    # Login, payment verification, AI quota and checkout live only on isolated account API.
    # No cross-origin cookies or public CORS. Authorization is checked by account_server.
    location /api/account/ {
        limit_except GET POST { deny all; }
        proxy_pass http://vc-vestaapp-account:8777;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 45s;
        proxy_send_timeout 45s;
        add_header Cache-Control "private, no-store" always;
    }

    location /api/market/ {
        limit_except GET { deny all; }
        proxy_pass http://vc-vestaapp-market:8766;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
        add_header Cache-Control "no-store" always;
    }
    location /api/ {
        return 404;
    }
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
