plugins {
    id 'com.android.application'
}

android {
    namespace 'ir.vestaland.app'
    compileSdk 36

    defaultConfig {
        applicationId 'ir.vestaland.app'
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName '1.0.1'

        def bazaarRsa = (System.getenv('BAZAAR_RSA_PUBLIC_KEY') ?: '').replace('\\', '\\\\').replace('"', '\\"')
        buildConfigField 'String', 'BAZAAR_RSA_PUBLIC_KEY', '"' + bazaarRsa + '"'
    }

    buildFeatures {
        buildConfig true
    }

    def ksPath = System.getenv('BAZAAR_KEYSTORE_PATH')
    if (ksPath) {
        signingConfigs {
            release {
                storeFile file(ksPath)
                storePassword System.getenv('BAZAAR_KEYSTORE_PASSWORD')
                keyAlias System.getenv('BAZAAR_KEY_ALIAS')
                keyPassword System.getenv('BAZAAR_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            if (ksPath) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.work:work-runtime:2.10.1'
    implementation 'com.github.cafebazaar.Poolakey:poolakey:2.2.0'
}
